name: FreeBSD Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: freebsd-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freebsd-kea:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run FreeBSD integration tests
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          copyback: false
          prepare: |
            set -eu
            pkg install -y bash curl jq kea gmake shellcheck
            install -d -m 0750 /var/run/kea /var/db/kea /usr/local/etc/kea
          run: |
            set -eu
            gmake lint

            printf '%s\n' ci-control-plane > /usr/local/etc/kea/kea-api-user
            printf '%s\n' ci-only-password > /usr/local/etc/kea/kea-api-password
            chmod 0600 /usr/local/etc/kea/kea-api-user /usr/local/etc/kea/kea-api-password

            cat > /usr/local/etc/kea/kea-dhcp4-ci.conf <<'JSON'
            {
              "Dhcp4": {
                "interfaces-config": {
                  "interfaces": [ "lo0" ]
                },
                "control-sockets": [
                  {
                    "socket-type": "http",
                    "socket-address": "127.0.0.1",
                    "socket-port": 18000,
                    "authentication": {
                      "type": "basic",
                      "realm": "kea-ci",
                      "directory": "/usr/local/etc/kea",
                      "clients": [
                        {
                          "user-file": "kea-api-user",
                          "password-file": "kea-api-password"
                        }
                      ]
                    }
                  }
                ],
                "hooks-libraries": [
                  {
                    "library": "/usr/local/lib/kea/hooks/libdhcp_host_cmds.so"
                  }
                ],
                "lease-database": {
                  "type": "memfile",
                  "persist": false,
                  "name": "/var/db/kea/kea-leases4-ci.csv"
                },
                "subnet4": [
                  {
                    "id": 1,
                    "subnet": "127.10.0.0/24",
                    "pools": [
                      { "pool": "127.10.0.100 - 127.10.0.200" }
                    ]
                  }
                ]
              }
            }
            JSON

            kea-dhcp4 -t /usr/local/etc/kea/kea-dhcp4-ci.conf

            daemon -p /tmp/kea-dhcp4-ci.pid -f \
              /usr/local/sbin/kea-dhcp4 -c /usr/local/etc/kea/kea-dhcp4-ci.conf

            cleanup() {
              [ -f /tmp/kea-dhcp4-ci.pid ] && kill "$(cat /tmp/kea-dhcp4-ci.pid)" 2>/dev/null || true
            }
            trap cleanup EXIT HUP INT TERM

            auth='ci-control-plane:ci-only-password'
            i=0
            until curl -fsS --user "$auth" -H 'Content-Type: application/json' \
              -d '{"command":"status-get"}' \
              http://127.0.0.1:18000/ >/tmp/kea-status.json; do
              i=$((i + 1))
              [ "$i" -lt 30 ] || {
                echo 'Kea DHCP4 HTTP API did not become ready' >&2
                exit 1
              }
              sleep 1
            done
            jq -e '.[0].result == 0' /tmp/kea-status.json

            reservation_payload=$(jq -n '{
              command:"reservation-add",
              arguments:{
                reservation:{
                  "subnet-id":1,
                  "hw-address":"02:00:00:00:00:10",
                  "ip-address":"127.10.0.10",
                  "hostname":"ci-vm"
                }
              }
            }')
            curl -fsS --user "$auth" -H 'Content-Type: application/json' \
              -d "$reservation_payload" \
              http://127.0.0.1:18000/ >/tmp/kea-add.json
            jq -e '.[0].result == 0' /tmp/kea-add.json

            get_payload=$(jq -n '{
              command:"reservation-get",
              arguments:{
                "subnet-id":1,
                "identifier-type":"hw-address",
                identifier:"02:00:00:00:00:10"
              }
            }')
            curl -fsS --user "$auth" -H 'Content-Type: application/json' \
              -d "$get_payload" \
              http://127.0.0.1:18000/ >/tmp/kea-get.json
            jq -e '.[0].result == 0' /tmp/kea-get.json
            jq -e '.[0].arguments."ip-address" == "127.10.0.10"' /tmp/kea-get.json

            delete_payload=$(jq -n '{
              command:"reservation-del",
              arguments:{
                "subnet-id":1,
                "identifier-type":"hw-address",
                identifier:"02:00:00:00:00:10"
              }
            }')
            curl -fsS --user "$auth" -H 'Content-Type: application/json' \
              -d "$delete_payload" \
              http://127.0.0.1:18000/ >/tmp/kea-delete.json
            jq -e '.[0].result == 0' /tmp/kea-delete.json
