name: V2 PostgreSQL

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bkcp
          POSTGRES_PASSWORD: bkcp
          POSTGRES_DB: bkcp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bkcp -d bkcp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BKCP_TEST_DATABASE_URL: postgres://bkcp:bkcp@127.0.0.1:5432/bkcp?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -tags=integration ./internal/state/postgres/...
