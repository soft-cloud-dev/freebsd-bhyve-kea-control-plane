name: Serialize Preparation and Execution

on:
  push:
    branches: [feat/v2-execution]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-execution
      - name: Acquire the execution key during preparation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('internal/state/postgres/execution.go')
          text = path.read_text()
          apply_marker = '''\tdefer func() { _ = tx.Rollback(ctx) }()
          \tif _, err := tx.Exec(ctx, `SELECT pg_advisory_xact_lock(hashtextextended($1, 0))`, resourceLockKey(site.ControlPlaneID, normalized.Name)); err != nil {'''
          apply_replacement = '''\tdefer func() { _ = tx.Rollback(ctx) }()
          \tif err := lockExecutionPreparation(ctx, tx, normalized.Name); err != nil {
          \t\treturn state.PreparedApply{}, err
          \t}
          \tif _, err := tx.Exec(ctx, `SELECT pg_advisory_xact_lock(hashtextextended($1, 0))`, resourceLockKey(site.ControlPlaneID, normalized.Name)); err != nil {'''
          if apply_marker not in text:
              raise SystemExit('apply preparation marker not found')
          text = text.replace(apply_marker, apply_replacement, 1)

          delete_marker = '''\tdefer func() { _ = tx.Rollback(ctx) }()
          \tif _, err := tx.Exec(ctx, `SELECT pg_advisory_xact_lock(hashtextextended($1, 0))`, resourceLockKey(site.ControlPlaneID, name)); err != nil {'''
          delete_replacement = '''\tdefer func() { _ = tx.Rollback(ctx) }()
          \tif err := lockExecutionPreparation(ctx, tx, name); err != nil {
          \t\treturn state.PreparedApply{}, err
          \t}
          \tif _, err := tx.Exec(ctx, `SELECT pg_advisory_xact_lock(hashtextextended($1, 0))`, resourceLockKey(site.ControlPlaneID, name)); err != nil {'''
          if delete_marker not in text:
              raise SystemExit('delete preparation marker not found')
          text = text.replace(delete_marker, delete_replacement, 1)
          path.write_text(text)

          path = Path('internal/state/postgres/reconcile.go')
          text = path.read_text()
          marker = '''\tdefer func() { _ = tx.Rollback(ctx) }()
          \tif _, err := tx.Exec(ctx, `SELECT pg_advisory_xact_lock(hashtextextended($1, 0))`, resourceLockKey(site.ControlPlaneID, name)); err != nil {'''
          replacement = '''\tdefer func() { _ = tx.Rollback(ctx) }()
          \tif err := lockExecutionPreparation(ctx, tx, name); err != nil {
          \t\treturn state.PreparedApply{}, err
          \t}
          \tif _, err := tx.Exec(ctx, `SELECT pg_advisory_xact_lock(hashtextextended($1, 0))`, resourceLockKey(site.ControlPlaneID, name)); err != nil {'''
          if marker not in text:
              raise SystemExit('reconcile preparation marker not found')
          text = text.replace(marker, replacement, 1)
          path.write_text(text)
          PY
          gofmt -w internal/state/postgres/execution.go internal/state/postgres/reconcile.go
      - name: Commit preparation locking
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/state/postgres/execution.go internal/state/postgres/reconcile.go
          git commit -m 'fix(state): block preparation during active execution'
          git push origin HEAD:feat/v2-execution
