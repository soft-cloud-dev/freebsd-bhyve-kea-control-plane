name: Fix Inet Canonicalization

on:
  push:
    branches: [feat/v2-execution]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-execution
      - name: Read inet values without host masks
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('internal/state/postgres/execution.go'): [
                  ('SELECT pool_name,ip_address::text,mac_address::text,dataset_name,zvol_name,kea_subnet_id,image_name,image_digest,allocation_generation,allocated_at,released_at',
                   'SELECT pool_name,host(ip_address)::text,mac_address::text,dataset_name,zvol_name,kea_subnet_id,image_name,image_digest,allocation_generation,allocated_at,released_at'),
              ],
              Path('internal/state/postgres/repository.go'): [
                  ('SELECT pool_name, ip_address::text, mac_address::text, dataset_name, zvol_name, kea_subnet_id, image_name, image_digest, allocation_generation, allocated_at, released_at',
                   'SELECT pool_name, host(ip_address)::text, mac_address::text, dataset_name, zvol_name, kea_subnet_id, image_name, image_digest, allocation_generation, allocated_at, released_at'),
              ],
          }

          for path, changes in replacements.items():
              text = path.read_text()
              for old, new in changes:
                  if old not in text:
                      raise SystemExit(f'missing expected SQL in {path}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
          gofmt -w internal/state/postgres/execution.go internal/state/postgres/repository.go
      - name: Commit canonicalization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/state/postgres/execution.go internal/state/postgres/repository.go
          git commit -m 'fix(state): canonicalize allocated IP host values'
          git push origin HEAD:feat/v2-execution
