name: Bare-Metal bhyve E2E

on:
  workflow_dispatch:
    inputs:
      vm_name:
        description: Temporary VM name
        required: false
        default: gha-e2e
      template:
        description: vm-bhyve template name
        required: false
        default: freebsd

permissions:
  contents: read

concurrency:
  group: bhyve-e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: [self-hosted, freebsd-baremetal]
    timeout-minutes: 45
    environment: bare-metal-e2e

    env:
      VM_NAME: ${{ inputs.vm_name }}-${{ github.run_id }}
      VM_TEMPLATE: ${{ inputs.template }}
      PGDATABASE: inventory
      PGUSER: postgres
      IPAM_POOL: vm-lan
      VM_OWNER: github-actions
      CLOUD_INIT_USER: gha
      SSH_PUBLIC_KEY_FILE: /var/run/freebsd-bhyve-kea-e2e/id_ed25519.pub

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify bare-metal prerequisites
        run: |
          set -eu
          test "$(uname -s)" = FreeBSD
          sysctl -n hw.vmm.vmx.initialized >/dev/null 2>&1 || \
            sysctl -n hw.vmm.svm.features >/dev/null 2>&1
          command -v vm
          command -v psql
          command -v jq
          command -v curl
          command -v makefs
          service kea_dhcp4 status
          service kea_ctrl_agent status
          service postgresql status

      - name: Prepare ephemeral SSH key
        run: |
          set -eu
          sudo install -d -m 0700 /var/run/freebsd-bhyve-kea-e2e
          sudo ssh-keygen -q -t ed25519 -N '' \
            -f /var/run/freebsd-bhyve-kea-e2e/id_ed25519
          sudo chmod 0600 /var/run/freebsd-bhyve-kea-e2e/id_ed25519
          sudo chmod 0644 /var/run/freebsd-bhyve-kea-e2e/id_ed25519.pub

      - name: Provision and boot VM
        run: |
          set -eu
          sudo -E sh scripts/provision_vm.sh "$VM_NAME" "$VM_TEMPLATE"

      - name: Verify inventory and Kea state
        run: |
          set -eu
          row=$(sudo -u postgres psql -X -qAt -F '|' -d inventory -c \
            "SELECT status, ip_address, mac_address FROM vms WHERE name='${VM_NAME}';")
          test -n "$row"
          status=$(printf '%s' "$row" | cut -d'|' -f1)
          ip=$(printf '%s' "$row" | cut -d'|' -f2)
          mac=$(printf '%s' "$row" | cut -d'|' -f3)
          test "$status" = running

          payload=$(jq -n \
            --arg mac "$mac" \
            '{command:"reservation-get",service:["dhcp4"],arguments:{"subnet-id":1,"identifier-type":"hw-address",identifier:$mac}}')
          response=$(curl -fsS -H 'Content-Type: application/json' \
            -d "$payload" http://127.0.0.1:8000/)
          printf '%s' "$response" | jq -e --arg ip "$ip" \
            '.[0].result == 0 and .[0].arguments."ip-address" == $ip'

      - name: Wait for guest SSH
        run: |
          set -eu
          ip=$(sudo -u postgres psql -X -qAt -d inventory -c \
            "SELECT ip_address FROM vms WHERE name='${VM_NAME}';")
          i=0
          until ssh -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=5 \
            -i /var/run/freebsd-bhyve-kea-e2e/id_ed25519 \
            "${CLOUD_INIT_USER}@${ip}" true; do
            i=$((i + 1))
            [ "$i" -lt 60 ] || {
              echo "Guest SSH did not become ready at ${ip}" >&2
              vm info "$VM_NAME" || true
              exit 1
            }
            sleep 5
          done

      - name: Collect diagnostics
        if: always()
        run: |
          vm info "$VM_NAME" || true
          sudo -u postgres psql -d inventory -c \
            "SELECT * FROM vms WHERE name='${VM_NAME}';" || true

      - name: Destroy test VM and release state
        if: always()
        run: |
          set +e
          sudo -E sh scripts/rollback_vm.sh "$VM_NAME"
          sudo rm -rf /var/run/freebsd-bhyve-kea-e2e
