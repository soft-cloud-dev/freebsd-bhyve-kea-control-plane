name: Format Execution Branch

on:
  push:
    branches: [feat/v2-execution]

permissions:
  contents: write

concurrency:
  group: format-execution-branch
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-execution
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format Go sources
        run: gofmt -w cmd internal migrations
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cmd internal migrations
          git commit -m 'style: gofmt execution sources'
          git push origin HEAD:feat/v2-execution
