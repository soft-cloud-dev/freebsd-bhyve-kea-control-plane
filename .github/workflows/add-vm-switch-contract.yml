name: Add VM Switch Contract

on:
  push:
    branches: [feat/v2-execution]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-execution
      - name: Add vm_switch configuration and driver checks
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('internal/config/site_decode.go')
          text = path.read_text()
          text = text.replace(
              'VMBridge            string `json:"vm_bridge"`\n\tVMDataset',
              'VMBridge            string `json:"vm_bridge"`\n\tVMSwitch            string `json:"vm_switch"`\n\tVMDataset',
              1,
          )
          text = text.replace(
              'rejectUnknown(host, "external_interface", "management_interface", "vm_bridge", "vm_dataset", "vm_root")',
              'rejectUnknown(host, "external_interface", "management_interface", "vm_bridge", "vm_switch", "vm_dataset", "vm_root")',
              1,
          )
          marker = '''\tif site.Host.VMBridge, err = requiredString(host, "vm_bridge"); err != nil {
          \t\treturn Site{}, err
          \t}
          '''
          replacement = marker + '''\tif site.Host.VMSwitch, err = optionalString(host, "vm_switch"); err != nil {
          \t\treturn Site{}, err
          \t}
          \tif site.Host.VMSwitch == "" {
          \t\tsite.Host.VMSwitch = site.Host.VMBridge
          \t}
          '''
          if marker not in text:
              raise SystemExit('site host decode marker not found')
          text = text.replace(marker, replacement, 1)
          path.write_text(text)

          path = Path('internal/config/site_validate.go')
          text = path.read_text()
          marker = '''\tif strings.TrimSpace(s.Host.VMBridge) == "" {
          \t\tproblems = append(problems, errors.New("host.vm_bridge is required"))
          \t}
          '''
          replacement = marker + '''\tif strings.TrimSpace(s.Host.VMSwitch) == "" {
          \t\tproblems = append(problems, errors.New("host.vm_switch is required"))
          \t}
          '''
          if marker not in text:
              raise SystemExit('site validation marker not found')
          text = text.replace(marker, replacement, 1)
          path.write_text(text)

          path = Path('internal/planner/execution.go')
          text = path.read_text()
          text = text.replace(
              'VMBridge  string `json:"vm_bridge"`\n\tVMDataset',
              'VMBridge  string `json:"vm_bridge"`\n\tVMSwitch  string `json:"vm_switch"`\n\tVMDataset',
              1,
          )
          old = 'Host: ExecutionHost{VMBridge: site.Host.VMBridge, VMDataset: site.Host.VMDataset, VMRoot: site.Host.VMRoot},'
          new = '''Host: ExecutionHost{
          \t\t\tVMBridge: site.Host.VMBridge, VMSwitch: executionVMSwitch(site.Host),
          \t\t\tVMDataset: site.Host.VMDataset, VMRoot: site.Host.VMRoot,
          \t\t},'''
          if old not in text:
              raise SystemExit('planner host input marker not found')
          text = text.replace(old, new, 1)
          insert = '''
          func executionVMSwitch(host config.Host) string {
          \tif host.VMSwitch != "" {
          \t\treturn host.VMSwitch
          \t}
          \treturn host.VMBridge
          }

          '''
          marker = 'func executionReferences('
          text = text.replace(marker, insert + marker, 1)
          path.write_text(text)

          path = Path('internal/execution/system.go')
          text = path.read_text()
          start = text.index('func (d *SystemDriver) ensureVMDefinition(')
          end = text.index('func (d *SystemDriver) ensureVMConfig(', start)
          replacement = r'''func (d *SystemDriver) ensureVMDefinition(ctx context.Context, input planner.StepInput) (Result, error) {
          	switchName := input.Host.VMSwitch
          	if switchName == "" {
          		switchName = input.Host.VMBridge
          	}
          	output, err := d.Runner.Run(ctx, "vm", "switch", "list")
          	if err != nil {
          		return Result{}, err
          	}
          	found := false
          	bridgeMatches := false
          	for _, line := range strings.Split(string(output), "\n") {
          		fields := strings.Fields(line)
          		if len(fields) == 0 || fields[0] != switchName {
          			continue
          		}
          		found = true
          		for _, field := range fields[1:] {
          			if field == input.Host.VMBridge {
          				bridgeMatches = true
          				break
          			}
          		}
          		break
          	}
          	if found && !bridgeMatches {
          		return Result{}, fmt.Errorf("%w: vm-bhyve switch %s is not backed by %s", state.ErrBlocked, switchName, input.Host.VMBridge)
          	}
          	if !found {
          		if _, err := d.Runner.Run(ctx, "vm", "switch", "create", "-t", "manual", "-b", input.Host.VMBridge, switchName); err != nil {
          			return Result{}, err
          		}
          		output, err = d.Runner.Run(ctx, "vm", "switch", "list")
          		if err != nil {
          			return Result{}, err
          		}
          		if !switchLineMatches(string(output), switchName, input.Host.VMBridge) {
          			return Result{}, fmt.Errorf("%w: vm-bhyve switch postcondition is not satisfied", state.ErrDrift)
          		}
          	}

          	guestDir := filepath.Join(input.Host.VMRoot, input.Resource)
          	if err := os.MkdirAll(guestDir, 0o750); err != nil {
          		return Result{}, err
          	}
          	return Result{Postcondition: map[string]any{"guest_dir": guestDir, "switch": switchName, "bridge": input.Host.VMBridge}}, nil
          }

          func switchLineMatches(output, switchName, bridge string) bool {
          	for _, line := range strings.Split(output, "\n") {
          		fields := strings.Fields(line)
          		if len(fields) == 0 || fields[0] != switchName {
          			continue
          		}
          		for _, field := range fields[1:] {
          			if field == bridge {
          				return true
          			}
          		}
          	}
          	return false
          }

          '''
          text = text[:start] + replacement + text[end:]
          text = text.replace('input.Host.VMBridge, input.Allocation.MACAddress', 'input.Host.VMSwitch, input.Allocation.MACAddress', 1)
          path.write_text(text)

          path = Path('config/site.example.toml')
          text = path.read_text()
          text = text.replace('vm_bridge = "bridge0"\n', 'vm_bridge = "bridge0"\nvm_switch = "public"\n', 1)
          path.write_text(text)

          path = Path('schemas/site.schema.json')
          schema = json.loads(path.read_text())
          schema['properties']['host']['properties']['vm_switch'] = {'type': 'string', 'minLength': 1}
          path.write_text(json.dumps(schema, indent=2) + '\n')
          PY
          gofmt -w internal/config/site_decode.go internal/config/site_validate.go internal/planner/execution.go internal/execution/system.go
      - name: Commit VM switch contract
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/config/site_decode.go internal/config/site_validate.go internal/planner/execution.go internal/execution/system.go config/site.example.toml schemas/site.schema.json
          git commit -m 'feat(config): separate vm switch and bridge'
          git push origin HEAD:feat/v2-execution
