name: Extend Execution Inspection

on:
  push:
    branches: [feat/v2-execution]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-execution
      - name: Expose observations and step contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('internal/state/postgres/repository.go')
          text = path.read_text()

          operation_marker = '''\toperation, err := r.latestOperation(ctx, out.Resource.UUID)\n'''
          observation_block = '''\tvar observation state.Observation
          \tvar observedJSON []byte
          \tif err := r.pool.QueryRow(ctx, `
          SELECT uuid::text, resource_uuid::text, collected_at, observer_version,
                 vm_state, storage_state, kea_state, seed_state, power_state, observed,
                 COALESCE(error_code, ''), COALESCE(error_detail, ''), COALESCE(plan_digest, '')
          FROM bkcp.vm_observations
          WHERE resource_uuid = $1
          ORDER BY collected_at DESC, uuid DESC
          LIMIT 1`, out.Resource.UUID).Scan(
          \t\t&observation.UUID, &observation.ResourceUUID, &observation.CollectedAt, &observation.ObserverVersion,
          \t\t&observation.VMState, &observation.StorageState, &observation.KeaState, &observation.SeedState, &observation.PowerState,
          \t\t&observedJSON, &observation.ErrorCode, &observation.ErrorDetail, &observation.PlanDigest,
          \t); err == nil {
          \t\tif err := json.Unmarshal(observedJSON, &observation.Observed); err != nil {
          \t\t\treturn state.Inspection{}, fmt.Errorf("decode observation: %w", err)
          \t\t}
          \t\tout.Observation = &observation
          \t} else if !errors.Is(err, pgx.ErrNoRows) {
          \t\treturn state.Inspection{}, fmt.Errorf("inspect observation: %w", err)
          \t}

          '''
          if operation_marker not in text:
              raise SystemExit('operation marker not found')
          text = text.replace(operation_marker, observation_block + operation_marker, 1)

          old_query = '''SELECT operation_uuid::text, sequence, driver, action, input_digest, status, attempts, started_at, completed_at, COALESCE(error_code, ''), COALESCE(error_detail, '')
          FROM bkcp.operation_steps WHERE operation_uuid = $1 ORDER BY sequence'''
          new_query = '''SELECT operation_uuid::text, sequence, driver, action, input_digest, input_json,
                 COALESCE(postcondition_json, ''), COALESCE(postcondition_digest, ''),
                 status, attempts, started_at, completed_at, COALESCE(error_code, ''), COALESCE(error_detail, '')
          FROM bkcp.operation_steps WHERE operation_uuid = $1 ORDER BY sequence'''
          if old_query not in text:
              raise SystemExit('operation step query not found')
          text = text.replace(old_query, new_query, 1)

          old_scan = '''if err := rows.Scan(&step.OperationUUID, &step.Sequence, &step.Driver, &step.Action, &step.InputDigest, &step.Status, &step.Attempts, &step.StartedAt, &step.CompletedAt, &step.ErrorCode, &step.ErrorDetail); err != nil {'''
          new_scan = '''if err := rows.Scan(
          \t\t\t&step.OperationUUID, &step.Sequence, &step.Driver, &step.Action, &step.InputDigest, &step.InputJSON,
          \t\t\t&step.PostconditionJSON, &step.PostconditionDigest, &step.Status, &step.Attempts,
          \t\t\t&step.StartedAt, &step.CompletedAt, &step.ErrorCode, &step.ErrorDetail,
          \t\t); err != nil {'''
          if old_scan not in text:
              raise SystemExit('operation step scan not found')
          text = text.replace(old_scan, new_scan, 1)

          path.write_text(text)
          PY
          gofmt -w internal/state/postgres/repository.go
      - name: Commit inspection evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/state/postgres/repository.go
          git commit -m 'feat(state): expose execution evidence in inspect'
          git push origin HEAD:feat/v2-execution
