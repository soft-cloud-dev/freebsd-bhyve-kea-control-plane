{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": [ "bridge0" ]
    },
    "control-sockets": [
      {
        "socket-type": "http",
        "socket-address": "127.0.0.1",
        "socket-port": 8000,
        "authentication": {
          "type": "basic",
          "realm": "kea-dhcp4-control-plane",
          "directory": "/usr/local/etc/kea",
          "clients": [
            {
              "user-file": "kea-api-user",
              "password-file": "kea-api-password"
            }
          ]
        }
      }
    ],
    "hooks-libraries": [
      {
        "library": "/usr/local/lib/kea/hooks/libdhcp_host_cmds.so"
      }
    ],
    "lease-database": {
      "type": "memfile",
      "persist": true,
      "name": "kea-leases4.csv"
    },
    "hosts-database": {
      "type": "memfile",
      "persist": true,
      "name": "kea-hosts4.csv"
    },
    "valid-lifetime": 3600,
    "renew-timer": 900,
    "rebind-timer": 1800,
    "subnet4": [
      {
        "id": 1,
        "subnet": "10.0.20.0/24",
        "pools": [
          { "pool": "10.0.20.100 - 10.0.20.250" }
        ],
        "option-data": [
          { "name": "routers", "data": "10.0.20.1" },
          { "name": "domain-name-servers", "data": "10.0.20.1" },
          { "name": "domain-name", "data": "vm.internal" }
        ],
        "reservations": []
      }
    ],
    "loggers": [
      {
        "name": "kea-dhcp4",
        "output_options": [
          { "output": "syslog" }
        ],
        "severity": "INFO"
      }
    ]
  }
}
