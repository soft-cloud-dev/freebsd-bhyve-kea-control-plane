# /etc/pf.conf

ext_if = "igb0"
mgmt_if = "vlan10"
lan_if = "bridge0"
mgmt_net = "10.0.10.0/24"
lan_net = "10.0.20.0/24"

set block-policy drop
set skip on lo0
set loginterface $ext_if

scrub in all fragment reassemble max-mss 1440

# Translate VM LAN traffic to the host's external address.
nat on $ext_if inet from $lan_net to any -> ($ext_if)

block log all
antispoof quick for { $ext_if $mgmt_if $lan_if }

# blacklistd normally manages its own anchor through blacklistd-helper.
anchor "blacklistd/*"

# Use flags any so PF can create state for an SSH connection that was already
# established before the ruleset was enabled during a remote installation.
pass in quick on $mgmt_if proto tcp from $mgmt_net to ($mgmt_if) port 22 \
    flags any keep state (max-src-conn 10, max-src-conn-rate 5/30)

pass in quick on $lan_if proto udp from any port 68 to 255.255.255.255 port 67 keep state
pass in quick on $lan_if proto udp from $lan_net to ($lan_if) port 67 keep state
pass out quick on $lan_if proto udp from port 67 to any port 68 keep state

pass in quick on $lan_if proto { tcp udp } from $lan_net to ($lan_if) port 53 keep state

# Allow VM-LAN clients to reach Stork on its canonical management address.
# This exception precedes both the host-service and management-network blocks.
pass in quick on $lan_if proto tcp from $lan_net to ($mgmt_if) port 8080 keep state

# Permit VM guests to reach the WAN, but do not let them use the host as a
# path into the management network or connect to other host services.
pass in quick on $lan_if inet proto icmp from $lan_net to ($lan_if) \
    icmp-type { echoreq, unreach } keep state
block in quick on $lan_if inet from $lan_net to self
block in quick on $lan_if inet from $lan_net to $mgmt_net
pass in quick on $lan_if inet from $lan_net to any keep state

# Allow ICMP for ping and Path MTU Discovery
pass in quick inet proto icmp all icmp-type { echoreq, unreach } keep state

# Grafana is management-only. Stork is available on management and VM-LAN.
# Prometheus and exporters bind to loopback and require no external PF rule.
pass in quick on $mgmt_if proto tcp from $mgmt_net to ($mgmt_if) port { 3000 8080 } keep state

pass out all keep state
