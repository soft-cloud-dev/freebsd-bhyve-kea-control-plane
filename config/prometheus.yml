global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    site: freebsd-bhyve

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090

  - job_name: freebsd-host
    static_configs:
      - targets:
          - 127.0.0.1:9100
        labels:
          role: bhyve-host

  - job_name: postgresql
    static_configs:
      - targets:
          - 127.0.0.1:9187
        labels:
          database: inventory
