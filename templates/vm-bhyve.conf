# Example vm-bhyve template for UEFI guests.
# Copy this file into the vm-bhyve templates directory and adjust per workload.

loader="uefi"
cpu="2"
memory="2G"

network0_type="virtio-net"
network0_switch="public"

# Use a zvol-backed disk. vm-bhyve does not accept volblocksize through
# disk0_opts; create or tune the zvol separately before first boot.
disk0_type="virtio-blk"
disk0_dev="sparse-zvol"
disk0_name="disk0"
disk0_size="20G"

# Valid disk0_opts are bhyve device options such as direct, nocache, ro,
# or sectorsize=logical[/physical].
disk0_opts="nocache"

# The provisioner creates this NoCloud seed inside the guest directory.
disk1_type="ahci-cd"
disk1_dev="file"
disk1_name="seed.iso"

utctime="yes"
virt_random="yes"
